name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches the crate version
        id: crate
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "jack-http-server"))')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag must be v$version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: node --test backend/tests/frontend.test.cjs
      - run: cargo publish --dry-run --locked
      - name: Check whether the crate version is already published
        id: registry
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = f'https://crates.io/api/v1/crates/jack-http-server/{os.environ["CRATE_VERSION"]}'
          request = urllib.request.Request(url, headers={"User-Agent": "jack-http-server release workflow"})
          try:
              with urllib.request.urlopen(request, timeout=30):
                  published = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f'published={str(published).lower()}', file=output)
          PY
      - name: Publish to crates.io
        if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
