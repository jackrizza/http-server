[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-session = { version = "0.10.1", features = ["cookie-session"] }
actix-web = { version = "4.10.2", features = ["rustls-0_23"] }
rustls = "0.23.26"
rustls-pemfile = "2.2.0"
env_logger = "0.11.8"
futures = "0.3.31"
futures-util = "0.3.31"
nanoid = "0.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
chrono = "0.4.40"
log = "0.4.27"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["rt", "time"] }
